version: '3.8'
services:
  db:
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql    # persistent volume

  redis:
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Docker/Dockerfile.prod
    container_name: soundcloud_backend_prod
    restart: always
    ports:
      - "3000:3000"        # or remove this and put nginx in front
    env_file:
      - .env.prod


volumes:
  pg_data:
  redis_data: