services:
  db:
    image: postgres:alpine
    container_name: harmonica-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis-soundcloud
    restart: always
    volumes:
      - redis_data:/data

  backend:
    image: elhussienawad/harmonica-backend:latest
    container_name: harmonica-backend-prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: harmonica-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/nginx/certs:ro
    depends_on:
      - backend
      # - frontend

  # frontend:
  #   image: elhussienawad/harmonica-frontend:latest
  #   build:
  #     context: ../Frontend
  #     dockerfile: Docker/Dockerfile.prod
  #   container_name: harmonica-frontend-prod
  #   restart: always

volumes:
  pg_data:
  redis_data: