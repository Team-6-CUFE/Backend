version: '3.8'

services:
  # --- Database Service ---
  db:
    image: postgres:alpine
    container_name: soundcloud_db
    environment:
      POSTGRES_DB: SoundCloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234567890
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SoundCloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis Service ---
  redis:
    image: redis:alpine
    container_name: redis_soundcloud
    ports:
      - "6379:6379"

  # --- Backend Service ---
  backend:
    build: .
    container_name: soundcloud_backend
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started