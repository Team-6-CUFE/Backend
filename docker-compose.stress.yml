services:
  db:
    image: postgres:alpine
    platform: linux/amd64
    container_name: harmonica-db-stress
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234567890"
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    platform: linux/amd64
    container_name: harmonica-redis-stress
    ports:
      - "6379:6379"
